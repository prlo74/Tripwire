# Evidence records. Written by Claude after opening and reading each source; checked by
# pipeline/evidence.py on every run (tier, quote length, quote present in the source text,
# date window, rule clause). A record never labels anything by itself: it creates a
# PROPOSAL that the team approves or rejects in the page.
#
# kind:
#   finding                  qualifying finding (see rules.yaml black.qualifying_findings)
#   open_case                open suit/complaint on (a)/(b) past a motion to dismiss   -> Watch
#   settlement_no_admission  settlement without admission                             -> Watch
#   values_link              company-sourced link to a theme                          -> Aligned gate 2
#   lead                     Tier-2 or incomplete; needs a primary source; never proposed
#
# Quotes are verbatim (<= 50 words). "..." joins two verbatim fragments.

records:
  - id: fox-dominion-falsity-2023
    tickers: [FOXA, FOX]
    company: Fox Corporation
    cik: 1754301
    kind: finding
    clause: a
    finding_type: merits_ruling
    finding_body: court
    event_date: 2023-03-31
    summary: >-
      Delaware Superior Court granted Dominion summary judgment on falsity: Fox News statements
      about Dominion and the 2020 election were false. Fox Corp and Fox News Network settled on
      April 18, 2023 (about $800M including a related suit, per Fox's filing).
    caveat: >-
      The court decided falsity only. Actual malice (the "knowingly" part) was left for trial and
      never decided because the case settled. The team's rule counts summary judgment on falsity
      as a qualifying finding. The ruling names Fox News Network, LLC, a Fox Corp subsidiary.
    confidence: High
    sources:
      - url: https://courts.delaware.gov/Opinions/Download.aspx?id=345820
        publisher: Superior Court of the State of Delaware (C.A. No. N21C-03-257 EMD)
        doc_date: 2023-03-31
        quote: >-
          The evidence developed in this civil proceeding demonstrates that is CRYSTAL clear that
          none of the Statements relating to Dominion about the 2020 election are true. Therefore,
          the Court will grant summary judgment in favor of Dominion on the element of falsity.
      - url: https://www.sec.gov/Archives/edgar/data/1754301/000162828025024466/fox-20250331.htm
        publisher: Fox Corporation Form 10-Q (SEC EDGAR)
        doc_date: 2025-05-12
        quote: >-
          On March 31, 2023, the court in the Dominion case issued its rulings on summary judgment
          motions that were unfavorable to the Company. Following these rulings, on April 18, 2023,
          the Company and its subsidiary, Fox News Network, LLC, entered into a Release and
          Settlement Agreement with Dominion

