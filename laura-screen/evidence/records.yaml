  - id: tesla-diaz-verdict-2021
    tickers: [TSLA]
    company: Tesla, Inc.
    cik: 1318605
    kind: finding
    clause: b
    finding_type: jury_verdict
    finding_body: jury
    event_date: 2021-10-04
    summary: >-
      A federal jury (N.D. Cal., Diaz v. Tesla) returned a verdict against Tesla on a former
      contingent worker's race-discrimination claims at the Fremont factory. Damages were later
      reduced ($136.9M to $15M to $3.175M after a retrial); the parties settled confidentially in
      March 2024.
    caveat: >-
      NEW vs. the September starting list, which had TSLA on Watch. The rule counts "a jury
      verdict, even if later reduced", and October 2021 is inside the 7-year window (until
      2028-10-04). The worker was a contingent (staffing-agency) worker. This is a proposal for the
      team to decide.
    confidence: High
    sources:
      - url: https://www.sec.gov/Archives/edgar/data/1318605/000162828024017503/tsla-20240331.htm
        publisher: Tesla, Inc. Form 10-Q (SEC EDGAR)
        doc_date: 2024-04-24
        quote: >-
          On October 4, 2021, in a case captioned Diaz v. Tesla, a jury in the Northern District of
          California returned a verdict against Tesla on claims by a former contingent worker that
          he was subjected to race discrimination
      - url: https://www.sec.gov/Archives/edgar/data/1318605/000162828024017503/tsla-20240331.htm
        publisher: Tesla, Inc. Form 10-Q (SEC EDGAR)
        doc_date: 2024-04-24
        quote: >-
          the damages awarded against Tesla were reduced from an initial $ 136.9 million (October 4,
          2021) down to $ 15 million (April 13, 2022), and then further down to $ 3.175 million
          (April 3, 2023).

  - id: tesla-crd-eeoc-open-2026
    tickers: [TSLA]
    company: Tesla, Inc.
    cik: 1318605
    kind: open_case
    clause: b
    event_date: 2026-07-23
    summary: >-
      California Civil Rights Department suit (filed Feb 9, 2022) alleging systemic race
      discrimination at Fremont; first trial phase set for Sept 21, 2026. Separate EEOC suit (filed
      Sept 28, 2023) for race harassment and retaliation is in discovery. EEOC issued a cause
      finding on June 1, 2022.
    caveat: >-
      Both suits are past the pleading stage (one set for trial, one in discovery). Whether the CRD
      trial actually began on Sept 21, 2026 was not confirmed from a primary source this run
      (calcivilrights.ca.gov refused scripted access). Open question for the team: does an EEOC
      "cause finding" count as an "agency finding" under the Black rule? This screen treats it as
      NOT qualifying until the team decides, because it is a preliminary determination, not an
      adjudication.
    tripwire: >-
      A liability finding in the CRD trial or in EEOC v. Tesla (N.D. Cal.) -> propose Black under
      (b). If the Diaz proposal is approved, TSLA is already Black and this becomes context.
    confidence: High
    sources:
      - url: https://www.sec.gov/Archives/edgar/data/1318605/000162828026049270/tsla-20260630.htm
        publisher: Tesla, Inc. Form 10-Q (SEC EDGAR)
        doc_date: 2026-07-23
        quote: >-
          on February 9, 2022, the California Civil Rights Department ("CRD," formerly "DFEH") filed
          a civil complaint against Tesla in Alameda County, California Superior Court, alleging
          systemic race discrimination, hostile work environment and pay equity claims, among
          others.
      - url: https://www.sec.gov/Archives/edgar/data/1318605/000162828026049270/tsla-20260630.htm
        publisher: Tesla, Inc. Form 10-Q (SEC EDGAR)
        doc_date: 2026-07-23
        quote: >-
          The first phase of the trial is currently set for September 21, 2026. Additionally, on
          June 1, 2022, the Equal Employment Opportunity Commission ("EEOC") issued a cause finding
          against Tesla that closely parallels the CRD's allegations.

  - id: meta-doj-fha-settlement-2022
    tickers: [META]
    company: Meta Platforms, Inc.
    cik: 1326801
    kind: settlement_no_admission
    clause: b
    event_date: 2022-06-27
    summary: >-
      DOJ sued Meta (S.D.N.Y., June 21, 2022) alleging its housing-ad delivery system
      discriminated by race and other traits under the Fair Housing Act; settled the same month
      with no admission and no finding of liability. Court approved it June 27, 2022.
    caveat: >-
      The underlying HUD Charge of Discrimination (March 28, 2019) followed a "reasonable cause"
      determination; that is now older than 7 years and is a charge, not an adjudication.
    tripwire: >-
      A new adjudicated finding (court ruling, jury verdict, or agency finding stating a
      violation) that Meta engaged in (a) or (b) -> propose Black.
    confidence: High
    sources:
      - url: https://www.justice.gov/crt/case-document/file/1516666/dl
        publisher: U.S. Department of Justice, Civil Rights Division (settlement agreement, 22 Civ. 5187)
        doc_date: 2022-06-27
        quote: >-
          this Settlement Agreement is for settlement purposes only and does not constitute an
          admission by Meta of any of the allegations contained in the HUD Charge or the Complaint,
          nor does it constitute any finding of liability against Meta
      - url: https://www.justice.gov/crt/case/united-states-v-meta-platforms-inc-fka-facebook-inc-sdny
        publisher: U.S. Department of Justice, Civil Rights Division (case page)
        doc_date: 2022-06-27
        quote: >-
          alleged that Meta's housing advertising system discriminated against Facebook users based
          on their race, color, religion, sex, disability, familial status, and national origin, in
          violation of the Fair Housing Act (FHA).

  - id: meta-states-youth-case-2026
    tickers: [META]
    company: Meta Platforms, Inc.
    cik: 1326801
    kind: open_case
    clause: a
    event_date: 2026-08-26
    summary: >-
      Multistate attorneys-general case (N.D. Cal.) alleging Meta misled the public about risks of
      Instagram and Facebook to young users. Trial began Aug 18, 2026; a settlement of up to $17.1B
      was announced Aug 26, 2026, subject to court approval.
    caveat: >-
      The California AG release does not mention an admission. The settlement document itself was
      not reviewed this run, so "no admission" is not yet confirmed. Until the court approves it,
      this is treated as an open case under (a).
    tripwire: >-
      If the approved settlement or a court order contains an admission or finding that Meta
      knowingly misled the public -> propose Black under (a). If approved with no admission ->
      Watch (settlement with no admission).
